name: Ingest Wire Feeds & Update Stories

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape_and_update.yml'
      - '*.py'
      - '*.js'
      - '*.css'
      - '*.svg'
      - 'CNAME'
      - 'robots.txt'
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('your-news-lens-pr-{0}', github.event.number) || 'your-news-lens-publish' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run publishing and voting regressions
        run: |
          python -m unittest discover -s tests
          node --test tests/polling.test.cjs
          node --check app.js

  publish:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.edition.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and render stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YNL_EDITORIAL_MODEL: ${{ vars.YNL_EDITORIAL_MODEL }}
        run: python engine.py
      - name: Build the public Pages artifact
        run: python build_site.py
      - name: Commit the edition
        id: edition
        run: |
          git config user.name "Your News Lens Bot"
          git config user.email "bot@yournewslens.com"
          git add data/stories.json index.html
          if ! git diff --staged --quiet; then
            git commit -m "chore(wire): publish updated edition"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! python build_site.py --check-live; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.edition.outputs.deploy == 'true'
        with:
          path: dist

  deploy-pages:
    if: needs.publish.outputs.deploy == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
