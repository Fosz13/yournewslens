name: Ingest Wire Feeds & Update Stories

on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape_and_update.yml'
      - '*.py'
      - '*.js'
      - '*.css'
      - '*.svg'
      - 'CNAME'
      - 'robots.txt'
      - 'index.html'
      - 'netlify.toml'
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('your-news-lens-pr-{0}', github.event.number) || 'your-news-lens-publish' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run publishing and voting regressions
        run: |
          python -m unittest discover -s tests
          node --test tests/polling.test.cjs
          node --check app.js

  publish:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore the previous edition
        run: |
          wire="$RUNNER_TEMP/wire-data"
          if git ls-remote --exit-code origin refs/heads/wire-data; then
            git fetch --depth=1 origin refs/heads/wire-data
            git worktree add --detach "$wire" FETCH_HEAD
            cp "$wire/data/stories.json" data/stories.json
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git worktree add --detach "$wire" HEAD
            git -C "$wire" rm -rf .
          fi
      - name: Fetch and render stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YNL_EDITORIAL_MODEL: ${{ vars.YNL_EDITORIAL_MODEL }}
        run: python engine.py
      - name: Publish to the data branch
        run: |
          wire="$RUNNER_TEMP/wire-data"
          python build_site.py --wire "$wire"
          cp netlify.toml "$wire/"
          git -C "$wire" add data/stories.json v1/edition.json netlify.toml
          if git -C "$wire" diff --cached --quiet; then exit 0; fi
          git -C "$wire" -c user.name="Your News Lens Bot" -c user.email="bot@yournewslens.com" \
            commit -m "chore(wire): publish updated edition"
          git -C "$wire" push origin HEAD:refs/heads/wire-data

  build-pages:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
