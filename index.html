<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your News Lens</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <h1>Your News Lens</h1>
            <p class="tagline">Dynamic Multi-Perspective News Aggregation</p>
        </div>
    </header>
    <main class="container">
        <section id="lens-selector" class="lens-selector">
            <button class="lens-btn active" onclick="switchLens('all')">All Lenses</button>
            <button class="lens-btn" onclick="switchLens('Objective')">Objective</button>
            <button class="lens-btn" onclick="switchLens('Analytical')">Analytical</button>
            <button class="lens-btn" onclick="switchLens('Critical')">Critical</button>
            <button class="lens-btn" onclick="switchLens('Forward-Looking')">Forward-Looking</button>
        </section>
        <div id="feed-container">
            <div class="loading-state">Loading latest news lenses...</div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Your News Lens. Powered by Gemini AI.</p>
    </footer>
    <script src="app.js?v=20"></script>
</body>
</html>
